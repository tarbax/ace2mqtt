name: "ace2mqtt"
slug: "ace2mqtt"
version: "0.2.0-beta.7"
description: "Lees Alfen laadpaalstatus uit en publiceer die via MQTT met Home Assistant Discovery."
url: "https://github.com/tarbax/ace2mqtt/tree/main/ace2mqtt"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
services:
  - mqtt:want
options:
  charger:
    host: ""
    username: "admin"
    password: ""
    http: false
    socket: 1
  mqtt:
    host: "core-mosquitto"
    port: 1883
    topic_prefix: "ace2mqtt"
    discovery_prefix: "homeassistant"
  limits:
    current_min: 6
    current_max: 32
    comfort_power_max_kw: 4.0
    poll_interval: 10
    offline_after: 300
    meter_current_max: 63
  evcc:
    loadpoint: 1
    vehicles: []
  solar_controls: true
  meter_controls: false
  log_level: "info"
schema:
  charger:
    host: str
    port: port?
    username: str
    password: password
    http: bool
    socket: int(1,2)
  mqtt:
    host: str
    port: port
    username: str?
    password: password?
    topic_prefix: str
    discovery_prefix: str
  limits:
    current_min: int(1,64)
    current_max: int(1,64)
    comfort_power_max_kw: float(1.35,11)
    poll_interval: int(5,300)
    offline_after: int(0,3600)
    meter_current_max: int(1,100)
  evcc:
    url: url?
    loadpoint: int(1,)
    password: password?
    vehicles:
      - uid: str
        vehicle: str
  solar_controls: bool
  meter_controls: bool
  log_level: list(debug|info|warning|error)
