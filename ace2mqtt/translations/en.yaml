configuration:
  charger:
    name: Charger
    description: Connection to the Alfen charger and the socket that is controlled.
    fields:
      host:
        name: Host
        description: Hostname or IP address of the charger.
      port:
        name: Port
        description: Optional. Defaults to 443 for HTTPS or 80 for HTTP.
      username:
        name: Username
        description: User name for the charger's management interface.
      password:
        name: Password
        description: Password for the charger's management interface.
      http:
        name: Use HTTP
        description: Talk to the charger over plain HTTP instead of HTTPS.
      socket:
        name: Socket
        description: Socket (1 or 2) that the controls and RFID detection apply to.
  mqtt:
    name: MQTT
    description: Leave host at core-mosquitto with an empty username to use the Mosquitto add-on automatically.
    fields:
      host:
        name: Host
        description: Hostname of the MQTT broker.
      port:
        name: Port
        description: Port of the MQTT broker.
      username:
        name: Username
        description: Optional. Leave empty to use the Supervisor MQTT service or an anonymous broker.
      password:
        name: Password
        description: Optional password for the MQTT broker.
      topic_prefix:
        name: Topic prefix
        description: Prefix for state, control and availability topics. Use a unique prefix per charger.
      discovery_prefix:
        name: Discovery prefix
        description: MQTT Discovery prefix configured in Home Assistant.
  limits:
    name: Limits and polling
    description: Ranges of the controls and how often the charger is polled.
    fields:
      current_min:
        name: Minimum charging current (A)
        description: Lower end of the charging current control.
      current_max:
        name: Maximum charging current (A)
        description: Upper end of the charging current control (at most 64 A).
      comfort_power_max_kw:
        name: Maximum Comfort power (kW)
        description: Upper end of the Comfort power control, 1.35-11 kW in steps of 0.05.
      poll_interval:
        name: Poll interval (s)
        description: Seconds to wait between polls of the charger.
      offline_after:
        name: Unavailable after (s)
        description: Entities keep their last value during a short charger outage and only become unavailable after this many seconds of failed polls. 0 marks them unavailable immediately.
  evcc:
    name: evcc
    description: Optional. Assigns a vehicle in evcc based on the RFID card that was used.
    fields:
      url:
        name: URL
        description: For example http://evcc:7070. Leave empty to disable the evcc vehicle assignment.
      loadpoint:
        name: Loadpoint
        description: evcc loadpoint number the vehicle is assigned to.
      password:
        name: Password
        description: Only needed when evcc authentication is enabled.
      vehicles:
        name: Vehicles
        description: "One row per RFID card, with its UID and the evcc internal vehicle name. For vehicles created in the evcc web interface, use the full ID such as db:1. For YAML-configured vehicles, use their name value. The display title is a separate value."
  solar_controls:
    name: Solar controls
    description: Show Comfort power, Green share and Charging mode. Turn off when the firmware does not support them.
  log_level:
    name: Log level
    description: Use debug to log every alfenctl call when troubleshooting.
