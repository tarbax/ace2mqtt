name: Tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r ace2mqtt/requirements.txt
      - run: PYTHONPATH=ace2mqtt:ace2mqtt/tests python -m unittest discover -s ace2mqtt/tests
